name: Manual Matrix Sensitivity
on:
  workflow_dispatch:
    inputs:
      matrix_id:
        description: 'Matrix ID, scenario ID, comma-separated IDs, or all'
        required: true
        default: all
        type: string
permissions:
  contents: read
jobs:
  sensitivity:
    name: Manual Matrix Sensitivity
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.13.5'
          terraform_wrapper: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - run: npm ci --ignore-scripts
      - run: npm run matrix:validate
      - name: Collect configuration and image evidence
        run: node security/prepare_evidence.mjs
      - name: Check the selected oracle's sensitivity
        env:
          MATRIX_ID: ${{ inputs.matrix_id }}
        run: node security/matrix_sensitivity.mjs --matrix "$MATRIX_ID"
      - name: Upload sensitivity evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: manual-matrix-sensitivity
          path: |
            artifacts/*.json
            artifacts/*.jsonl
            artifacts/*.md
          if-no-files-found: warn
