name: Manual EKS Release
on:
  workflow_dispatch: {}
permissions:
  contents: read
env:
  AWS_REGION: us-west-2
jobs:
  gate:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    needs: gate
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.reference }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_PUBLISH_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@7290e214a610b32bc0eef81748948b6d466a8783 # v2
        id: registry
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: app
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: ${{ steps.registry.outputs.registry }}/matrix-demo:${{ github.sha }}
      - name: Record the published image
        id: image
        env:
          REPOSITORY: ${{ steps.registry.outputs.registry }}/matrix-demo
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "reference=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: publish
    runs-on: [self-hosted, linux, matrix-private-deploy]
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Update the bootstrapped demo Deployment
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
        run: |
          [[ "$IMAGE" =~ ^[0-9]{12}\.dkr\.ecr\.us-west-2\.amazonaws\.com/matrix-demo@sha256:[0-9a-f]{64}$ ]]
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"
          kubectl --namespace matrix-demo set image deployment/matrix-demo "web=$IMAGE"
          kubectl --namespace matrix-demo rollout status deployment/matrix-demo --timeout=180s
