apiVersion: apps/v1
kind: Deployment
metadata:
  name: matrix-demo
  namespace: matrix-demo
  labels:
    app.kubernetes.io/version: "1.0.0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: matrix-demo
  template:
    metadata:
      labels:
        app: matrix-demo
    spec:
      serviceAccountName: matrix-reader
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: web
          image: REPLACE_WITH_RELEASE_IMAGE
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: matrix-demo
  namespace: matrix-demo
spec:
  type: ClusterIP
  selector:
    app: matrix-demo
  ports:
    - port: 80
      targetPort: 8080
